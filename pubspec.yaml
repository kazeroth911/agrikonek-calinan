name: agrikonek_calinan
description: AgriKonek Calinan - mobile marketplace and connectivity app for pre-profiled smallholder farmers in Calinan District, Davao City.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.5.1
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  intl: ^0.19.0
  # Map preview on listing detail (paper §2.8, Table 3.2): OpenStreetMap
  # tiles, no API key or billing account.
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
