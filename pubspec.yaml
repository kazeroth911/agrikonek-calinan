name: agrikonek_calinan
description: AgriKonek Calinan - mobile marketplace and connectivity app for pre-profiled smallholder farmers in Calinan District, Davao City.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.5.1
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  intl: ^0.19.0
  # Map preview on listing detail (paper §2.8, Table 3.2): OpenStreetMap
  # tiles, no API key or billing account. 8.2+ caches tiles on the phone.
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  # Remembers the chosen app language on the phone.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Poppins (SIL Open Font License, assets/fonts/OFL.txt), bundled so the
  # app looks the same offline and needs no font download on weak signal.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
